name: Pocket Packet Sniffer CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests & Coverage Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install flake8 coverage

      - name: Lint with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend capture processing storage tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Backend Unittests with Statement + Branch Coverage Gate (>= 70%)
        run: |
          python -m coverage run --branch -m unittest discover -s tests
          python -m coverage report --show-missing --fail-under=70

      - name: Generate Coverage Reports
        if: always()
        run: |
          python -m coverage html -d coverage-report/html
          python -m coverage xml -o coverage-report/coverage.xml
          python -m coverage json -o coverage-report/coverage.json

      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
